# Dependabot keeps GitHub Actions versions up to date.
# This repo is a Claude plugin (no JS package manifest), so we only
# scan the workflows in .github/workflows.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
